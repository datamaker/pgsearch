# Development: build from source
services:
  pgsearch:
    build: .
    container_name: pgsearch
    ports:
      - "7700:7700"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=pgsearch
      - DB_PASSWORD=pgsearch
      - DB_NAME=pgsearch
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro

  postgres:
    image: postgres:16-alpine
    container_name: pgsearch-db
    environment:
      POSTGRES_USER: pgsearch
      POSTGRES_PASSWORD: pgsearch
      POSTGRES_DB: pgsearch
    ports:
      - "5432:5432"
    volumes:
      - pgsearch_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgsearch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgsearch_data:
